<section class="vh-100">
  <div class="container h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-12 col-xl-11">
        <div class="card text-black">
          <div class="card-body px-md-5 pb-5 pt-4">
            <div class="row justify-content-center">
              <i class="bi bi-arrow-left my-1 p-1" style="font-size: 2.5rem; cursor: pointer" routerLink="/students"></i>

              <div class="col-md-12 col-lg-7 col-xl-8 order-2 order-lg-1">

                <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4">Редактировать студента</p>

                <form class="mx-1 mx-md-4" [formGroup]="studentForm">

                  <!-- ФИО студента -->
                  <div class="row mb-4 align-items-center">
                    <div class="col-md-8 mb-1">
                      <label class="form-label fw-bold mb-0">
                        <i class="bi bi-person me-2"></i>ФИО студента
                      </label>
                    </div>
                    <div class="">
                      <input class="form-control" type="text" placeholder="Введите ФИО"
                             [ngStyle]="{'border-color': studentForm.get('name')?.invalid
                 && (studentForm.get('name')?.dirty || studentForm.get('name')?.touched) ? 'red' : '' }"
                             formControlName="name">
                    </div>
                  </div>


                  <!-- Средний балл -->
                  <div class="row mb-4 align-items-center">
                    <div class="col-md-8 mb-1">
                      <label class="form-label fw-bold mb-0">
                        <i class="bi bi-graph-up me-2"></i>Средний балл за последнюю сессию
                      </label>
                    </div>
                    <div class="">
                      <input class="form-control" type="number" placeholder="0.0"
                             [ngStyle]="{'border-color': studentForm.get('gpa')?.invalid
                 && (studentForm.get('gpa')?.dirty || studentForm.get('gpa')?.touched) ? 'red' : '' }"
                             formControlName="gpa">
                    </div>
                  </div>

                  <!-- Часы пропусков -->
                  <div class="row mb-4 align-items-center">
                    <div class="col-md-8 mb-1">
                      <label class="form-label fw-bold mb-0">
                        <i class="bi bi-clock  me-2"></i>Часы пропусков за месяц
                      </label>
                    </div>
                    <div class="">
                      <input class="form-control" type="number" placeholder="0"
                             [ngStyle]="{'border-color': studentForm.get('absencesHours')?.invalid
                 && (studentForm.get('absencesHours')?.dirty || studentForm.get('absencesHours')?.touched) ? 'red' : '' }"
                             formControlName="absencesHours">
                    </div>
                  </div>

                  <!-- Наличие пересдач -->
                  <div class="row mb-4 align-items-center">
                    <div class="col-md-8 mb-1">
                      <label class="form-label fw-bold mb-0">
                        <i class="bi bi-arrow-repeat me-2"></i>Наличие пересдач
                      </label>
                    </div>
                    <div class="">
                      <select class="form-control" formControlName="hasRetakes"
                              [ngStyle]="{'border-color': studentForm.get('hasRetakes')?.invalid
                 && (studentForm.get('hasRetakes')?.dirty || studentForm.get('hasRetakes')?.touched) ? 'red' : '' }">
                        <option value="" disabled selected>Выберите вариант</option>
                        <option [value]="true">Есть</option>
                        <option [value]="false">Нет</option>
                      </select>
                    </div>
                  </div>

                  <!-- Премия -->
                  <div class="row mb-4 align-items-center">
                    <div class="col-md-8 mb-1">
                      <label class="form-label fw-bold mb-0">
                        <i class="bi bi-cash me-2"></i>Премия
                      </label>
                    </div>
                    <div class="">
                      <input class="form-control" type="number" placeholder="0.00"
                             [ngStyle]="{'border-color': studentForm.get('bonusAmount')?.invalid
                 && (studentForm.get('bonusAmount')?.dirty || studentForm.get('bonusAmount')?.touched) ? 'red' : '' }"
                             formControlName="bonusAmount">
                    </div>
                  </div>

                  <!-- Тип стипендии -->
                  <div class="row mb-4 align-items-center">
                    <div class="col-md-8 mb-1">
                      <label class="form-label fw-bold mb-0">
                        <i class="bi bi-award me-2"></i>Тип стипендии
                      </label>
                    </div>
                    <div class="">
                      <input class="form-control" type="text" placeholder="Введите тип стипендии"
                             [ngStyle]="{'border-color': studentForm.get('stipendType')?.invalid
                 && (studentForm.get('stipendType')?.dirty || studentForm.get('stipendType')?.touched) ? 'red' : '' }"
                             formControlName="stipendType">
                    </div>
                  </div>

                  <!--buttons -->
                  <div class="row mt-5">
                    <div class="col-12">
                      <div class="d-flex justify-content-start">
                        <button type="button" class="btn btn-primary btn-lg w-100" (click)="editStudent()">
                          Сохранить
                        </button>
                      </div>
                    </div>
                  </div>

                </form>
              </div>
              <div class="col-md-12 col-lg-5 col-xl-4 d-inline-block align-items-center order-1 order-lg-2">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                     class="img-fluid" alt="Sample image">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
